services:
  - type: web
    name: luxe-ecommerce
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn Eshop.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "luxe-ecommerce.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: luxe-db
          property: connectionString

databases:
  - name: luxe-db
    databaseName: luxe
    user: luxe_user
